name: Assemble Berialo APK

on:
  push:
    paths:
      - 'apk_parts/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and verify APK
        shell: bash
        run: |
          cat apk_parts/part*.b64 | tr -d '\n\r ' | base64 -d > Berialo-v1.8.4.apk
          test "$(stat -c%s Berialo-v1.8.4.apk)" -eq 2200102
          echo "eb490f03afb5ead5d22ab7038a1f5fb9ccdf649b457b8610ba9fa25aeb11184f  Berialo-v1.8.4.apk" | sha256sum -c -

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.8.4 --yes || true
          git push --delete origin v1.8.4 || true
          gh release create v1.8.4 Berialo-v1.8.4.apk --title "Berialo v1.8.4" --notes "Berialo Android APK"

      - name: Upload workflow artifact fallback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Berialo-v1.8.4
          path: Berialo-v1.8.4.apk
