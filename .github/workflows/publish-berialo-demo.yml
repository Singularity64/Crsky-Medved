name: Publish Berialo animation demo

on:
  push:
    paths:
      - 'video_chunks/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild MP4
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          alpha='ghijklmnopqrstuv'
          rev={c:i for i,c in enumerate(alpha)}
          s=''.join(Path(f'video_chunks/part{i:02d}.txt').read_text(encoding='ascii').strip() for i in range(5))
          assert len(s) % 2 == 0
          out=bytes((rev[s[i]]<<4)|rev[s[i+1]] for i in range(0,len(s),2))
          p=Path('Berialo_animovana_mapa_ukazka.mp4')
          p.write_bytes(out)

          expected_size=634359
          expected_sha='75fa38007475c7a14d3686947bce60eb7efbc840f90b5ba7c334d64f5515f792'
          actual=hashlib.sha256(out).hexdigest()
          assert len(out)==expected_size, (len(out),expected_size)
          assert actual==expected_sha, (actual,expected_sha)
          print('MP4 OK', len(out), actual)
          PY

      - name: Upload video to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.8.4 Berialo_animovana_mapa_ukazka.mp4 --clobber
