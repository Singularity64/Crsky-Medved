name: Build Berialo APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'CeskyMedvidek/**'
      - '.github/workflows/main.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build clean APK
        working-directory: CeskyMedvidek
        run: gradle clean assembleDebug

      - name: Prepare APK
        run: cp CeskyMedvidek/app/build/outputs/apk/debug/app-debug.apk Berialo-2.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Berialo-APK
          path: Berialo-2.0.0.apk
          if-no-files-found: error

      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete berialo-latest --yes --cleanup-tag || true
          gh release create berialo-latest Berialo-2.0.0.apk --title "Berialo 2.0.0" --notes "Minimal Berialo start screen build"
