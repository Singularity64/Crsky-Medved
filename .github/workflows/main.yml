name: Build and install-test Berialo APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'CeskyMedvidek/**'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: CeskyMedvidek
        run: gradle clean assembleDebug

      - name: Verify APK archive and signature
        run: |
          unzip -t CeskyMedvidek/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs CeskyMedvidek/app/build/outputs/apk/debug/app-debug.apk

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            adb install CeskyMedvidek/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n cz.berialo.loading/cz.ceskymedvidek.app.MainActivity
            sleep 1
            adb shell pidof cz.berialo.loading
            sleep 3
            adb shell pidof cz.berialo.loading
            adb shell dumpsys activity activities | grep -E "cz.berialo.loading|MainActivity"

      - name: Prepare verified APK
        run: cp CeskyMedvidek/app/build/outputs/apk/debug/app-debug.apk Berialo-install-tested.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Berialo-install-tested
          path: Berialo-install-tested.apk
          if-no-files-found: error
