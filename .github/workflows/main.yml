name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install exact Domecek images
        working-directory: CeskyMedvidek
        run: |
          set -e
          mkdir -p app/src/main/res/drawable-nodpi
          cat imagepack/chunk*.txt | base64 -d > /tmp/domecek_exact10.zip
          rm -f app/src/main/res/drawable-nodpi/word_*.webp
          rm -f app/src/main/res/drawable/word_deka.xml
          rm -f app/src/main/res/drawable/word_stul.xml
          rm -f app/src/main/res/drawable/word_zidle.xml
          rm -f app/src/main/res/drawable/word_okno.xml
          rm -f app/src/main/res/drawable/word_dvere.xml
          unzip -o /tmp/domecek_exact10.zip -d app/src/main/res/drawable-nodpi
          ls -lh app/src/main/res/drawable-nodpi/word_*.webp

      - name: Build APK
        working-directory: CeskyMedvidek
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CeskyMedvidek-APK
          path: CeskyMedvidek/app/build/outputs/apk/debug/app-debug.apk
