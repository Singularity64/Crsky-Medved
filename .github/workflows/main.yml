name: Build Berialo APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'CeskyMedvidek/**'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build clean APK
        working-directory: CeskyMedvidek
        run: gradle clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Berialo-APK
          path: CeskyMedvidek/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
