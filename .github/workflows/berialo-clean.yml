name: Berialo Clean APK
on:
  push:
    branches: [main]
    paths: ['BerialoClean/**', '.github/workflows/berialo-clean.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: BerialoClean
        run: gradle clean assembleDebug
      - name: Verify
        run: |
          unzip -t BerialoClean/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose BerialoClean/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK
        run: cp BerialoClean/app/build/outputs/apk/debug/app-debug.apk BerialoClean.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BerialoClean
          path: BerialoClean.apk
